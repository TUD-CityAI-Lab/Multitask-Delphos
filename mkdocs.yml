site_name: Multitask Delphos
site_description: Reinforcement Learning for Assisted Discrete Choice Model Specification
site_url: https://tud-cityai-lab.github.io/Multitask-Delphos/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md

  - Start Here:
      - What Delphos Does: getting_started/overview.md
      - Installation: getting_started/installation.md
      - Quickstart: getting_started/quickstart.md
      - First Application: choice_modellers/first_application.md

  - User Guide:
      - Overview: user-guide/index.md
      - Understand Proposals and Results: choice_modellers/understanding_results.md
      - Control the Modelling Space: user-guide/modelling-space.md
      - Search Strategies and Parameters: user-guide/search-strategies.md
      - Estimate with Apollo: user-guide/apollo-estimation.md
      - Rank Candidate Models: choice_modellers/custom_objectives.md
      - Export Results: choice_modellers/exporting_results.md

  - Datasets:
      - Overview: datasets/overview.md
      - Catalogue Datasets: datasets/catalogue.md
      - Use Your Own Dataset: datasets/own-data.md
      - Schema Reference: datasets/dataset_format.md
      - Dataset Repository: datasets/repository.md

  - Research & Papers:
      - Overview: research/index.md
      - Papers and Reproducibility: research/papers.md
      - Framework Architecture: research/framework.md
      - MDP Formulation: research/mdp.md
      - Tasks and the Global Catalogue: research/task-and-catalogue.md
      - Multitask Training: research/training.md
      - Transfer and Evaluation: research/transfer.md
      - Apollo Estimation Environment: research/apollo-environment.md

  - Development:
      - Overview: development/index.md
      - Components: development/components.md
      - Contribution Workflow: development/contribution_workflow.md
      - Branching Strategy: development/branches.md
      - Documentation: development/documentation.md

  - Tutorials:
      - Tutorial Library: tutorials/index.md
      - Final-user Notebooks:
          - 01. Getting Started: tutorials/end-user/01_getting_started.ipynb
          - 02. Your Own Datasets: tutorials/end-user/02_your_own_datasets.ipynb
          - 03. Modelling Space: tutorials/end-user/03_modelling_space.ipynb
          - 04. Search Parameters: tutorials/end-user/04_delphos_parameters.ipynb
          - 05. Reward and Ranking: tutorials/end-user/05_reward_function.ipynb
          - 06. Quick Results: tutorials/end-user/06_quick_results.ipynb
          - 07. Robust Results: tutorials/end-user/07_robust_results.ipynb
          - 08. Apollo and Outputs: tutorials/end-user/08_environment_and_outputs.ipynb
      - Research Notebooks:
          - 01. Task Representation: tutorials/research/01_task.ipynb
          - 02. State Representation: tutorials/research/02_state.ipynb
          - 03. Action Space: tutorials/research/03_action.ipynb
          - 04. Apollo Generator: tutorials/research/04_apollo_generator.ipynb
          - 05. Apollo Estimator: tutorials/research/05_apollo_estimator.ipynb
          - 06. Results Cache: tutorials/research/06_results_cache.ipynb
          - 07. Environment: tutorials/research/07_environment.ipynb
          - 08. Integration Tests: tutorials/research/08_testing.ipynb

repo_url: https://github.com/TUD-CityAI-Lab/Multitask-Delphos
repo_name: Multitask-Delphos

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
