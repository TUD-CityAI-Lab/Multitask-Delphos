name: Documentation checks

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/check_documentation_links.py"
      - "scripts/check_tutorial_sync.py"
      - "scripts/tutorial_manifest.json"
      - "components/delphos"
      - "components/delphos-training"
      - ".github/workflows/documentation-*.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/check_documentation_links.py"
      - "scripts/check_tutorial_sync.py"
      - "scripts/tutorial_manifest.json"
      - "components/delphos"
      - "components/delphos-training"
      - ".github/workflows/documentation-*.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JUPYTER_PLATFORM_DIRS: "1"

jobs:
  build:
    name: Build documentation strictly
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Verify tutorial sources
        run: python scripts/check_tutorial_sync.py

      - name: Check documentation links
        run: python scripts/check_documentation_links.py

      - name: Build documentation
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/delphos-site"
